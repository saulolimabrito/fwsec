name: CI

on:
  push:
    branches: [main, feature/safe-apply]
  pull_request:
    branches: [main]

jobs:
  nft-integration:
    name: Scoped transactions and detached rollback (real nftables)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nftables
        run: sudo apt-get update -qq && sudo apt-get install -y nftables iptables iproute2
      - name: Run exclusively inside a disposable network namespace
        run: |
          set -o pipefail
          sudo env PYTHONPATH="$PWD/src" unshare --net python3 tests/nft_sandbox.py 2>&1 | tee /tmp/nft-test.log || {
            echo "::error::$(tail -n 20 /tmp/nft-test.log | tr '\n' ' ')"
            exit 1
          }
      - name: Verify live migration parity with real IPv4 and IPv6 packets
        run: |
          set -o pipefail
          for source in ufw csf; do
            sudo env PYTHONPATH="$PWD/src" unshare --net python3 tests/migration_sandbox.py --source "$source" 2>&1 | tee /tmp/migration-test.log || {
              echo "::error::$(tail -n 14 /tmp/migration-test.log | tr '\n' ' ')"
              exit 1
            }
          done
      - name: Verify legacy upgrade and executable rollback
        run: |
          set -o pipefail
          sudo env PYTHONPATH="$PWD/src" unshare --net python3 tests/upgrade_sandbox.py 2>&1 | tee /tmp/upgrade-test.log || {
            echo "::error::$(tail -n 25 /tmp/upgrade-test.log | tr '\n' ' ')"
            exit 1
          }

  lint:
    name: Lint (shellcheck, ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          python3 -m pip install --quiet ruff mypy
      - name: shellcheck (install.sh)
        run: shellcheck -S warning install.sh
      - name: ruff (src, target py38)
        run: ruff check src
      - name: mypy (src, strict)
        run: mypy src
      - name: Unit tests (stdlib unittest)
        run: python3 -m unittest discover -s tests
        env:
          PYTHONPATH: src

  python-floor:
    name: Python 3.8 floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Provision Python 3.8 and install fwsec
        run: |
          uv python install 3.8
          uv venv .venv --python 3.8
          uv pip install --python .venv/bin/python .
      - name: Smoke (fwsec -v / -c)
        run: |
          .venv/bin/fwsec -v
          .venv/bin/fwsec -c

  install-smoke:
    name: Install smoke — ${{ matrix.container }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - debian:12
          - ubuntu:22.04
          - ubuntu:24.04
          - rockylinux:8
          - rockylinux:9
          - fedora:latest
          - amazonlinux:2023
          - opensuse/leap:16.0
          - archlinux:latest
    container: ${{ matrix.container }}
    steps:
      - name: Bootstrap (git + curl needed by the checkout action)
        run: |
          . /etc/os-release
          case "${ID}" in
            debian|ubuntu) apt-get update -qq && apt-get install -y -qq git curl ca-certificates >/dev/null ;;
            rocky|almalinux|rhel|centos) dnf install --allowerasing -y -q git curl tar ca-certificates >/dev/null ;;
            fedora) dnf install -y -q git curl tar >/dev/null ;;
            amzn) dnf install --allowerasing -y -q git curl tar >/dev/null ;;
            opensuse-leap|sles) zypper --non-interactive install git curl tar ca-certificates >/dev/null ;;
            arch) pacman -Sy --noconfirm git curl >/dev/null ;;
          esac
      - uses: actions/checkout@v4
      - name: Install code without NET_ADMIN (--install-only)
        run: bash install.sh --force --install-only
      - name: Smoke (fwsec -v / -c)
        run: |
          /usr/local/bin/fwsec -v > /tmp/fwsec-version.log 2>&1 || { cat /tmp/fwsec-version.log; echo "::error::$(tr '\n' ' ' < /tmp/fwsec-version.log)"; exit 1; }
          /usr/local/bin/fwsec -c > /tmp/fwsec-check.log 2>&1 || { cat /tmp/fwsec-check.log; echo "::error::$(tr '\n' ' ' < /tmp/fwsec-check.log)"; exit 1; }

  install-smoke-alpine:
    name: Install smoke — alpine:3.22 (musl + OpenRC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run installer inside alpine:3.22
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache bash git curl tar >/dev/null &&
            bash install.sh --force --install-only &&
            fwsec -v &&
            fwsec -c
          '
