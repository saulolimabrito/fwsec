[firewall]
# Enable/disable fwsec (1 = enabled, 0 = disabled)
ENABLED = 1

# Optional reviewed live-policy snapshot. Empty preserves legacy TCP_IN/OUT
# behaviour. Set by the migration planner; never merges IPv4 and IPv6 ports.
INHERITED_POLICY =

# Inbound TCP ports allowed (comma separated, ranges supported: 8000:8080)
TCP_IN = 1157

# Outbound TCP ports allowed
TCP_OUT = 80,443,53,25,587,993,995,1157

# Legacy default is accept. Explicit drop makes TCP_OUT/UDP_OUT an egress
# allow-list, while preserving loopback, replies and ICMP/ICMPv6 control traffic.
# With INHERITED_POLICY set, the original family's OUTPUT policy is authoritative.
OUTPUT_POLICY = accept

# Inbound UDP ports allowed
UDP_IN = 53

# Outbound UDP ports allowed
UDP_OUT = 53,123

# Allow ICMP (ping) inbound
ICMP_IN = 1

# Enable IPv6 support
IPV6 = 1

# Whitelist bypass mark: tag allow-listed sources with a connection mark that
# management-guard chains at later nftables priorities accept early. Only
# enable on hosts whose nftables rules consume this mark (0 = disabled).
WHITELIST_MARK = 0

# Country (geo) policy — mutually exclusive, ISO-3166 alpha-2 codes:
#   GEO_BLOCK = "cn,ru"  drop traffic from the listed countries
#   GEO_ALLOW  = "br"    deny all: drop everyone EXCEPT the listed countries
# IPs in fwsec.allow always override the geo policy. After enabling, run:
#   fwsec --geo-update   (downloads the zone data and reloads the sets)
GEO_BLOCK =
GEO_ALLOW =

# 1 = also apply the geo policy on the forward hook (VM/container traffic).
# Leave 0 when this host routes traffic for virtual machines (NAT).
GEO_FORWARD = 0

# Max temporary IP blocks tracked
DENY_TEMP_IP_LIMIT = 100

# Max permanent IP blocks in deny list
DENY_IP_LIMIT = 1000

[containers]
# Container runtime compatibility mode (Docker / Podman / nerdctl).
# 1 = keep the forward chain permissive so container networking works and
#     apply fwsec allow/deny + CrowdSec bans to forwarded (container) traffic.
# 0 = no containers on this host; the forward chain drops everything.
# Set automatically by the installer when a runtime is detected.
CONTAINER_MODE = 0

# Policy for published container ports (-p 80:80 etc.):
#   open     = published ports accept traffic from any source (Docker default)
#   filtered = published ports only accept traffic from the fwsec allow list
CONTAINER_POLICY = open

[crowdsec]
# Enable CrowdSec integration
ENABLED = 1

# CrowdSec Local API URL
API_URL = http://127.0.0.1:8080

# Sync fwsec -d bans to CrowdSec decisions as well
SYNC_DENY = 1

[logging]
LOG_FILE = /var/log/fwsec.log
LOG_LEVEL = INFO
