[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fwsec"
version = "1.1.0"
description = "nftables + CrowdSec firewall manager — CSF-style CLI"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/saulolimabrito/fwsec"
Repository = "https://github.com/saulolimabrito/fwsec.git"
Issues = "https://github.com/saulolimabrito/fwsec/issues"
Security = "https://github.com/saulolimabrito/fwsec/security/policy"

[project.scripts]
fwsec = "fwsec.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fwsec"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
# mypy no longer accepts 3.8 as a target; the runtime floor stays 3.8
# (see [project] requires-python).
python_version = "3.9"
strict = true
